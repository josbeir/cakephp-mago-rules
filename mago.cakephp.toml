# Import this file from a project's mago.toml with:
# extends = "vendor/josbeir/cakephp-mago-rules/mago.cakephp.toml"

[extension-hosts.cakephp]
command = ["php", "vendor/josbeir/cakephp-mago-rules/bin/mago-cakephp-worker"]

# Mago owns generic formatting. These settings pin the CakePHP-specific
# choices that differ from, or are important additions to, PSR-12.
[formatter]
preset = "psr-12"
print-width = 120
single-quote = true
trailing-comma = true
space-after-cast-unary-prefix-operators = false
empty-line-before-return = true
sort-uses = "alphanumeric-ascending"
expand-use-groups = true

# Keep Mago's default catalogue enabled. Only CakePHP policy choices are
# configured here; consuming projects remain free to override any rule.
[linter.rules]
array-style = { enabled = true, level = "error", style = "short" }
block-statement = { enabled = true, level = "error" }
no-short-opening-tag = { enabled = true, level = "error" }
no-error-control-operator = { enabled = true, level = "error" }
no-assign-in-condition = { enabled = true, level = "error", ignore-while-statements = false }
no-redundant-parentheses = { enabled = true, level = "error" }
no-redundant-final = { enabled = true, level = "error" }
no-redundant-use = { enabled = true, level = "error" }
no-closing-tag = { enabled = true, level = "error" }
